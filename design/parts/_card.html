    </div>
    <div class="meta">
      <div class="mi"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>$LOC$</div>

    </div>
    <div class="why">
      <div class="lbl">Why this is a match</div>
      <p>$WHY$</p>
    </div>
    <div class="cfoot">
      <span class="app-cnt">$APPLICANTS$</span>
      $ATSCHIP$
      <div class="grow"></div>

  <div class="score">

      <svg viewBox="0 0 72 72"><circle cx="36" cy="36" r="30" fill="none" stroke="#2e343b" stroke-width="7"></circle><circle cx="36" cy="36" r="30" fill="none" stroke="$RINGCOL$" stroke-width="7" stroke-linecap="round" stroke-dasharray="188.5" stroke-dashoffset="$DASH$"></circle></svg>

    <div class="brk">
      <div class="brow"><span>Experience</span><i class="bar"><i style="width:$EXPW$;background:#5cd38a"></i></i><em>$EXP$</em></div>
      <div class="brow"><span>Skills</span><i class="bar"><i style="width:$SKLW$;background:#5cd38a"></i></i><em>$SKL$</em></div>
      <div class="brow"><span>Industry</span><i class="bar"><i style="width:$INDW$;background:#f0b23c"></i></i><em>$IND$</em></div>
